spring:
  datasource:
    url: jdbc:h2:mem:collegeconnect-test-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info

collegeconnect:
  whatsapp:
    worker-delay-ms: 3600000
    webhook-poll-delay-ms: 3600000
